<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusat Kendali Maggot Pak Joko</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2d6a4f;
            --accent: #40916c;
            --bg: #f8fdfa;
            --white: #ffffff;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .header { text-align: center; padding: 20px 0; }
        .header h1 { color: var(--primary); font-size: 1.5rem; margin: 0; }
        
        /* Grid Menu */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .menu-btn {
            background: var(--white);
            padding: 15px 5px;
            border-radius: 15px;
            text-align: center;
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-btn.active { border-color: var(--primary); background: #eef7f2; }
        .icon { font-size: 1.8rem; display: block; margin-bottom: 5px; }
        .label { font-size: 0.75rem; font-weight: 700; display: block; }

        /* Area Tampilan */
        .content-area {
            background: white;
            border-radius: 20px;
            height: 75vh;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        iframe { width: 100%; height: 100%; border: none; }
        
        .placeholder-text { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Green Maggot v8.0</h1>
        <p style="font-size: 0.8rem; color: #666;">Satu Aplikasi, Semua Kendali</p>
    </div>

    <div class="menu-grid">
        <div class="menu-btn" onclick="openNav('toko', 'https://kayy3.github.io/maggot-website/', this)">
            <span class="icon">🛒</span>
            <span class="label">TOKO</span>
        </div>

        <div class="menu-btn" onclick="openNav('internal', 'internal.html', this)">
            <span class="icon">⚙️</span>
            <span class="label">STOK</span>
        </div>

        <div class="menu-btn" onclick="openNav('toko', 'https://kayy3.github.io/maggot-website/money/', this)">
            <span class="icon">💰</span>
            <span class="label">KEUANGAN</span>
        </div>
    </div>

    <div class="content-area" id="main-view">
        <div class="placeholder-text">
            <p>Silakan pilih menu di atas untuk mulai mengelola bisnis Pak Joko.</p>
        </div>
    </div>

    <script>
        function openNav(type, url, element) {
            // Hapus status aktif di tombol lain
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
            // Tambah status aktif di tombol yang diklik
            element.classList.add('active');
            
            const view = document.getElementById('main-view');
            view.innerHTML = `<iframe src="${url}"></iframe>`;
        }
    </script>

</body>
</html>
