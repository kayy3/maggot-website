<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Super Maggot Pak Joko</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2d6a4f;
            --bg: #f0f4f2;
            --white: #ffffff;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; text-align: center; }
        .header { margin-bottom: 30px; }
        .header h1 { color: var(--primary); margin-bottom: 5px; }
        
        /* Grid Menu Utama */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .menu-card {
            background: var(--white);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .menu-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .icon { font-size: 2.5rem; margin-bottom: 10px; }
        .label { font-weight: 700; font-size: 0.9rem; }

        /* Frame Area untuk menampilkan Web */
        #content-frame {
            width: 100%;
            height: 70vh;
            border: none;
            margin-top: 25px;
            border-radius: 20px;
            background: white;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            display: none; /* Sembunyi dulu sebelum diklik */
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Super App Green Maggot</h1>
        <p>Pusat Kendali Bisnis Pak Joko</p>
    </div>

    <div class="menu-grid">
        <div class="menu-card" onclick="loadPage('https://kayy3.github.io/maggot-website/')">
            <span class="icon">🛒</span>
            <span class="label">Toko / Etalase</span>
        </div>

        <div class="menu-card" onclick="loadPage('internal.html')">
            <span class="icon">⚙️</span>
            <span class="label">Kelola Operasional</span>
        </div>

        <div class="menu-card" onclick="loadPage('https://catatku-web-placeholder.com')">
            <span class="icon">💰</span>
            <span class="label">Cek Keuangan</span>
        </div>
    </div>

    <iframe id="content-frame"></iframe>

    <script>
        function loadPage(url) {
            const frame = document.getElementById('content-frame');
            frame.src = url;
            frame.style.display = 'block'; // Munculkan frame saat tombol diklik
            window.scrollTo({ top: frame.offsetTop, behavior: 'smooth' });
        }
    </script>

</body>
</html>
