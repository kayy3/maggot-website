<script>
    // 1. Konfigurasi Database Anda
    const firebaseConfig = {
        apiKey: "AIzaSyDHpfHchBQ4VlSktHQAEee6aMAkrjNGmA4",
        authDomain: "greenmaggot-7149e.firebaseapp.com",
        databaseURL: "https://greenmaggot-7149e-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "greenmaggot-7149e",
        storageBucket: "greenmaggot-7149e.firebasestorage.app",
        messagingSenderId: "65907029772",
        appId: "1:65907029772:web:d05a3593e761e61777bb29"
    };

    // Inisialisasi Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const dbRef = firebase.database().ref('maggot_v10');

    // Variabel lokal (Data Default)
    let db = { stokH: 0, stokK: 0, hotels: [], contracts: [], history: [0,0,0,0,0] };
    let isInitialLoad = true; // Flag agar tidak menimpa data saat baru buka

    // 2. Mendengarkan Data Secara Real-time
    dbRef.on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
            console.log("Data diterima dari Cloud:", val);
            db = val;
            isInitialLoad = false; // Data cloud berhasil dimuat
            renderAll();
            if(document.getElementById('dashboard').classList.contains('active')) initChart();
        } else if (isInitialLoad) {
            // Jika cloud benar-benar kosong, baru buat data awal
            console.log("Cloud kosong, menginisialisasi...");
            save();
            isInitialLoad = false;
        }
    });

    // 3. Fungsi Simpan ke Cloud
    function save() {
        // Jangan simpan jika data cloud belum sempat dimuat (mencegah reset ke 0)
        if (isInitialLoad) return; 
        
        dbRef.set(db).then(() => {
            console.log("Sinkronisasi Berhasil");
        }).catch((err) => {
            console.error("Gagal sinkron:", err);
        });
    }

    // Fungsi Update Stok
    function addStokFisik() {
        const h = parseFloat(document.getElementById('in-hidup').value) || 0;
        const k = parseFloat(document.getElementById('in-kering').value) || 0;
        
        db.stokH += h;
        db.stokK += k;
        db.history.push(db.stokH + db.stokK);
        
        save(); // Kirim ke cloud
        Swal.fire('Berhasil', 'Data terupdate ke internet', 'success');
        document.getElementById('in-hidup').value = '';
        document.getElementById('in-kering').value = '';
    }

    // Fungsi Reset (Wipe Cloud)
    function confirmReset() {
        Swal.fire({
            title: 'Hapus Semua?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Ya, Reset Cloud'
        }).then((r) => {
            if (r.isConfirmed) {
                const resetData = { stokH: 0, stokK: 0, hotels: [], contracts: [], history: [0,0,0,0,0] };
                dbRef.set(resetData).then(() => location.reload());
            }
        });
    }
</script>
