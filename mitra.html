<script>
    // 1. Konfigurasi Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDHpfHchBQ4VlSktHQAEee6aMAkrjNGmA4",
        authDomain: "greenmaggot-7149e.firebaseapp.com",
        databaseURL: "https://greenmaggot-7149e-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "greenmaggot-7149e",
        storageBucket: "greenmaggot-7149e.firebasestorage.app",
        messagingSenderId: "65907029772",
        appId: "1:65907029772:web:d05a3593e761e61777bb29"
    };

    // Inisialisasi
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const dbRef = firebase.database().ref('maggot_v9');

    // Data Default
    let db = { stokH: 0, stokK: 0, hotels: [], contracts: [], history: [0,0,0,0,0] };
    let isInitialLoad = true;

    // Sinkronisasi Real-time
    dbRef.on('value', (s) => {
        const val = s.val();
        if(val) { 
            // Pastikan jika folder baru belum ada di cloud, web tidak error
            db = {
                stokH: val.stokH || 0,
                stokK: val.stokK || 0,
                hotels: val.hotels || [],
                contracts: val.contracts || [],
                history: val.history || [0,0,0,0,0]
            };
            isInitialLoad = false;
            renderAll(); 
            if(document.getElementById('dashboard').classList.contains('active')) initChart(); 
        } else if (isInitialLoad) {
            isInitialLoad = false;
            save(); 
        }
    });

    function save() { 
        if(isInitialLoad) return;
        dbRef.set(db); 
    }

    function showPage(e, id) {
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        e.currentTarget.classList.add('active');
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'dashboard') initChart();
        renderAll();
    }

    // FUNGSI UPDATE STOK
    function addStokFisik() {
        const h = parseFloat(document.getElementById('in-hidup').value) || 0;
        const k = parseFloat(document.getElementById('in-kering').value) || 0;
        db.stokH += h;
        db.stokK += k;
        db.history.push(db.stokH + db.stokK);
        save();
        Swal.fire('Berhasil', 'Data stok terupdate di Cloud.', 'success');
        document.getElementById('in-hidup').value=''; 
        document.getElementById('in-kering').value='';
    }

    // FUNGSI UPDATE LOGISTIK
    function addHotel() {
        const n = document.getElementById('h-nama').value;
        const l = parseFloat(document.getElementById('h-limbah').value) || 0;
        const j = document.getElementById('h-jarak').value;
        
        if(n && l) { 
            if(!db.hotels) db.hotels = []; // Proteksi jika array kosong
            db.hotels.push({n, l, j}); 
            save(); 
            Swal.fire('Tersimpan', 'Data Logistik telah masuk ke Cloud', 'success');
            document.getElementById('h-nama').value = '';
            document.getElementById('h-limbah').value = '';
            document.getElementById('h-jarak').value = '';
        } else {
            Swal.fire('Error', 'Nama dan Jumlah Limbah harus diisi', 'error');
        }
    }

    // FUNGSI UPDATE KONTRAK
    function addKontrak() {
        const n = document.getElementById('k-nama').value;
        const t = document.getElementById('k-tipe').value;
        const v = parseFloat(document.getElementById('k-vol').value) || 0;
        const h = parseFloat(document.getElementById('k-harga').value) || 0;
        const d = document.getElementById('k-tgl').value;

        if((t === "Hidup" && v > db.stokH) || (t === "Kering" && v > db.stokK)) {
            return Swal.fire('Gagal', 'Stok di Cloud tidak mencukupi!', 'error');
        }

        if(n && v && h && d) {
            if(!db.contracts) db.contracts = []; // Proteksi jika array kosong
            if(t === "Hidup") db.stokH -= v; else db.stokK -= v;
            db.contracts.push({n, t, v, h, d, s: 'Belum Lunas'});
            db.history.push(db.stokH + db.stokK);
            save(); 
            Swal.fire('Kontrak Dikunci', 'Data tersinkron ke semua perangkat.', 'success');
        } else {
            Swal.fire('Error', 'Semua kolom kontrak harus diisi', 'error');
        }
    }

    function renderAll() {
        const today = new Date().toISOString().split('T')[0];
        let totalL = 0; 
        if(db.hotels) db.hotels.forEach(h => totalL += h.l);
        
        document.getElementById('dash-limbah').innerText = `${totalL} / 500 kg`;
        document.getElementById('limbah-bar').value = totalL;
        document.getElementById('dash-total-stok').innerText = (db.stokH + db.stokK) + ' kg';
        
        let overdueCount = 0, cHtml = '';
        if(db.contracts) {
            db.contracts.forEach(k => {
                const isO = k.d < today && k.s === 'Belum Lunas';
                if(isO) overdueCount++;
                let b = isO ? 'bg-overdue' : (k.s === 'Lunas' ? 'bg-paid' : 'bg-pending');
                cHtml += `<div style="padding:8px; border-bottom:1px solid #eee; font-size:11px;"><b>${k.n}</b> <span class="badge ${b}" style="float:right">${isO ? 'OVERDUE' : k.s}</span></div>`;
            });
        }
        document.getElementById('dash-cust-list').innerHTML = cHtml;
        const alertBox = document.getElementById('urgent-alert');
        if(overdueCount > 0) { 
            alertBox.style.display = 'block'; 
            alertBox.innerHTML = `⚠️ PERINGATAN: ${overdueCount} Kontrak Melewati Jatuh Tempo!`; 
        } else {
            alertBox.style.display = 'none';
        }

        let hT = ''; 
        if(db.hotels) db.hotels.forEach(h => hT += `<tr><td>${h.n}</td><td>${h.l}kg</td><td>${h.j}km</td><td><span class="badge bg-paid">Low Carbon</span></td></tr>`);
        document.getElementById('tabel-hotel').innerHTML = hT;

        let kT = ''; 
        if(db.contracts) {
            db.contracts.forEach((k, i) => {
                let isO = k.d < today && k.s === 'Belum Lunas';
                let cls = isO ? 'bg-overdue' : (k.s === 'Lunas' ? 'bg-paid' : 'bg-pending');
                kT += `<tr><td>${k.n}</td><td>${k.t}</td><td>${k.d}</td><td><span class="badge ${cls}">${k.s}</span></td>
                <td><button onclick="toggleS(${i})" style="padding:2px 5px; font-size:10px; background:#2ecc71">Status</button> <button onclick="delK(${i})" style="padding:2px 5px; font-size:10px; background:#e74c3c">Hapus</button></td></tr>`;
            });
        }
        document.getElementById('tabel-kontrak').innerHTML = kT;
    }

    function toggleS(i) { db.contracts[i].s = db.contracts[i].s === 'Lunas' ? 'Belum Lunas' : 'Lunas'; save(); }
    function delK(i) { db.contracts.splice(i, 1); save(); }
    function confirmReset() { 
        Swal.fire({title:'Reset Data Cloud?', text: 'Semua data akan dihapus permanen!', icon:'warning', showCancelButton:true}).then(r => { 
            if(r.isConfirmed) {
                db = {stokH:0,stokK:0,hotels:[],contracts:[],history:[0,0,0,0,0]};
                dbRef.set(db).then(() => location.reload());
            }
        }); 
    }
    
    function initChart() {
        const ctx = document.getElementById('inventoryChart');
        if(window.chartObj) window.chartObj.destroy();
        window.chartObj = new Chart(ctx, {
            type: 'line',
            data: { labels: ['T-4','T-3','T-2','T-1','Now'], datasets: [{ label: 'Stok (kg)', data: db.history.slice(-5), borderColor: '#1e8449', tension: 0.4 }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }
    window.onload = () => renderAll();
</script>
